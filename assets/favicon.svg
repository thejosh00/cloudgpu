<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CloudGPU">
  <title>CloudGPU</title>
  <defs>
    <linearGradient id="cg-grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <mask id="cg-cloud-knockout">
      <rect x="0" y="0" width="64" height="64" fill="#fff"/>
      <g fill="#000" transform="translate(32 32) scale(1.45) translate(-32 -32)">
        <circle cx="26.5" cy="35" r="5.5"/>
        <circle cx="37.5" cy="35" r="5.5"/>
        <circle cx="32" cy="30.5" r="7"/>
        <rect x="26.5" y="35" width="11" height="5.5"/>
      </g>
    </mask>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#cg-grad)" mask="url(#cg-cloud-knockout)"/>
</svg>
